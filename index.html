<script>try{document.documentElement.dataset.th=localStorage.getItem('mp_th')||'sport'}catch(e){document.documentElement.dataset.th='sport'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,600;1,700&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Kanit:ital,wght@0,400;0,500;0,600;1,500;1,600;1,700&family=Sarabun:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root{color-scheme:light}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}
/* Layout: sticky dark site bar, tab strip per work type, then dashboard cards / room grids that scroll sideways inside their own frame. */
:root{
  --bg:#eef1f0; --surface:#ffffff; --surface2:#e5eae9; --ink:#18231f; --muted:#5a6b66; --line:#cfd8d5;
  --accent:#0d5f8f; --accent-ink:#ffffff; --accent-soft:#d9eaf4; --bar:#ffffff; --bar-ink:#18231f; --track:#dfe6e4;
  --done:#e3a82b; --cm:#2f7fb8; --qc2:#25936a; --warn:#c2571a; --dim:#c4c9c4; --shadow:none;
  --f-display:'IBM Plex Sans Thai','Sarabun',system-ui,sans-serif;
  --f-body:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
:root[data-th=sport]{--bg:#000000;--surface:#0f0f11;--surface2:#1a1a1d;--ink:#f4f4f5;--muted:#9b9ba3;--line:#2b2b30;--accent:#c6ff00;--accent-ink:#0a0a0a;--accent-soft:#1f2606;--bar:#000000;--bar-ink:#f4f4f5;--track:#26262b;--done:#ffb020;--cm:#3da5ff;--qc2:#2ee59d;--warn:#ff6b3d;--dim:#34343a;--f-display:'Kanit','Sarabun',system-ui,sans-serif;--f-mono:'Barlow Condensed','Kanit',ui-monospace,sans-serif;color-scheme:dark}
:root[data-th=civil]{--bg:#0b2f52;--surface:#0f3a66;--surface2:#154b7f;--ink:#eaf3ff;--muted:#9bbddb;--line:#2d6aa3;--accent:#ffc82e;--accent-ink:#11202f;--accent-soft:#17466f;--bar:#082340;--bar-ink:#eaf3ff;--track:#0b2f52;--done:#ffb020;--cm:#54c8ff;--qc2:#46e0a4;--warn:#ff8a4c;--dim:#4a7399;--f-display:'Chakra Petch','Sarabun',system-ui,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
header.top .wrap{max-width:none}
header.top{background:var(--bar);color:var(--bar-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.2px;margin-right:auto;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;max-width:100%;scrollbar-width:thin}
.tab{background:transparent;border:0;color:var(--muted);padding:7px 12px;border-radius:6px;white-space:nowrap;font-weight:500}
.tab:hover{background:var(--surface2)}
.tab[aria-selected=true]{background:var(--accent-soft);color:var(--accent)}
.tab.add{border:1px dashed var(--line)}
main{padding-block:18px 60px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:17px;font-weight:600}
.sub{color:var(--muted);font-size:12.5px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.sec{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.sec>.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec>.head .sub{margin-left:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:4px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.banner{background:#fff0d1;color:#a85f00;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}
.big,.m .v,.pc span,td,.hc,.c{font-family:var(--f-mono)}
td:first-child{font-family:var(--f-body)}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:16px;align-items:stretch}
.hero h1{font-size:26px;font-weight:700}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ring{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.ring svg{width:100%;max-width:150px;height:auto}
.ring .t{font-weight:600;font-size:13px}
.ring .n{font-size:11.5px;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero h1{font-size:22px}.big{font-size:26px}}
/* work cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.wc{text-align:left;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.wc:hover{border-color:var(--accent)}
.wc h3{font-size:16px;font-weight:600}
.m{display:grid;grid-template-columns:78px 1fr 44px;gap:8px;align-items:center;font-size:12.5px}
.m .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--track)}
.stack>i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* heat */
.heat{display:grid;gap:6px;align-items:stretch}
.hc{border:0;border-radius:8px;padding:10px 4px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.hl{display:flex;align-items:center;font-weight:500;font-size:13px;padding-right:6px}
.hh{text-align:center;font-size:12px;color:var(--muted);font-weight:600}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface2)}
.tw{border-radius:8px}
tr.wk td{background:var(--surface2);font-weight:600}
tr.it td:first-child{padding-left:28px}
tbody tr:last-child td{border-bottom:0}
.ft{min-width:0}.ft th{white-space:normal;min-width:88px;vertical-align:bottom}.ft td:first-child,.ft th:first-child{white-space:nowrap;min-width:0}.ft .pc .bar{width:34px}
.qs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.qs .card{display:flex;flex-direction:column;gap:4px}
.qs .lb{font-size:12.5px;color:var(--muted);font-weight:500}
.glg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center;border-top:1px solid var(--line);padding-top:10px}
.glg .k{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.glg .k i{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:20px;padding:0 4px;border-radius:5px;font-style:normal;font-size:11px;font-weight:600;font-family:var(--f-mono)}
.glg .gr{width:90px;height:12px;border-radius:4px}
.glg .nn{width:30px;height:20px;border-radius:5px;border:1px dashed var(--line)}
.btn,.chip,.tab,.opt,.bchip,.c,.hc,.wc,.gh,.gf{transition:background-color .18s ease,color .18s ease,border-color .18s ease,transform .12s ease,box-shadow .18s ease}
.btn:active,.chip:active,.tab:active,.opt:active,.bchip:active{transform:scale(.95)}
.c:not(.none):active{transform:scale(.82)}
.hc:active{transform:scale(.94)}
.wc:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(10,30,25,.10)}.wc:active{transform:scale(.98)}
.bar>i{transform-origin:left center;transition:width .5s cubic-bezier(.2,.8,.2,1)}
@keyframes fup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ringin{from{stroke-dashoffset:var(--rl)}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetpop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.enter>*{animation:fup .42s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(n+6){animation-delay:.25s}
.enter .cards>.wc{animation:fup .45s cubic-bezier(.2,.8,.2,1) both}
.enter .cards>.wc:nth-child(2){animation-delay:.08s}.enter .cards>.wc:nth-child(3){animation-delay:.16s}.enter .cards>.wc:nth-child(n+4){animation-delay:.24s}
.enter .bar>i,.enter .stack>i{animation:grow .8s cubic-bezier(.2,.8,.2,1) .15s both}
.enter .ring circle:nth-child(2){animation:ringin 1s cubic-bezier(.2,.8,.2,1) .1s both}
.enter .hc{animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
.enter .qs .card{animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
#modal:not([hidden]){animation:fin .2s ease}
#modal:not([hidden]) .sheet{animation:sheetup .3s cubic-bezier(.2,.8,.2,1)}
@media(min-width:640px){#modal:not([hidden]) .sheet{animation:sheetpop .25s cubic-bezier(.2,.8,.2,1)}}
.toast{animation:toastin .25s cubic-bezier(.2,.8,.2,1)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.expscope *{animation:none!important;transition:none!important}
/* ---- shared (brand button, splash) ---- */
.brand{position:relative;display:flex;flex-direction:column;align-items:flex-start;padding-right:34px}
.brandedit{position:absolute;right:0;top:0;border:1px solid var(--line);background:transparent;color:var(--accent);border-radius:4px;width:26px;height:26px;font-size:13px;padding:0}
.brandedit:hover{border-color:var(--accent)}
.thbtn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:4px;padding:6px 10px;font-size:13px;font-weight:500}
.thbtn:hover{border-color:var(--accent);color:var(--accent)}
.glg .gr{background:linear-gradient(90deg,var(--dim),#25936a)}
.pa_prev{background:repeating-conic-gradient(#8a949a 0 25%,#6e777c 0 50%) 0 0/16px 16px;border:1px solid var(--line);padding:6px;display:flex;justify-content:center}
.pa_prev canvas{max-width:100%;max-height:260px;width:auto;height:auto}
.wrow{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.ir{justify-content:space-between;flex-wrap:nowrap;padding:3px 0 3px 10px;font-size:13.5px}
.cust{box-shadow:0 0 0 2px #ff4fa3 inset}
.custtag{display:inline-flex;align-items:center;gap:6px;background:#ff4fa3;color:#1a0610;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700}
.prk{font:700 22px var(--f-display);fill:#ff4fa3;text-anchor:middle;paint-order:stroke;stroke:#000;stroke-width:4px;pointer-events:none}
.pr.cu polygon{stroke:#ff4fa3;stroke-width:4;stroke-dasharray:10 6}
.pdim{opacity:.18!important}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;cursor:pointer;padding:16px;text-align:center;transition:opacity .5s ease,transform .6s cubic-bezier(.7,0,.2,1)}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .sk{width:min(360px,78vw);height:auto;overflow:visible}
#splash .sk *{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) forwards;animation-delay:var(--d,0s)}
#splash .sk .y{stroke:var(--accent);stroke-width:2.6}
#splash .sk .t{stroke-width:1.2;opacity:.7}
@keyframes draw{to{stroke-dashoffset:0}}
#splash .lg{font:700 42px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.12em;color:var(--ink);display:flex;flex-wrap:wrap;justify-content:center;max-width:92vw}
#splash .lg span{display:inline-block;opacity:0;transform:translateY(14px);animation:lt .5s cubic-bezier(.2,.8,.2,1) forwards}
#splash .lg span.sp{width:.4em}
#splash .sb{font:600 13px var(--f-display);letter-spacing:.5em;margin-right:-.5em;text-transform:uppercase;color:var(--accent);opacity:0;animation:fin .5s ease 1.1s forwards}
#splash .bar2{width:min(260px,60vw);height:6px;background:var(--track);border:1px solid var(--line);overflow:hidden;opacity:0;animation:fin .3s ease .9s forwards}
#splash .bar2 i{display:block;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;animation:grow 1.4s cubic-bezier(.4,0,.2,1) 1s forwards}
#splash .tg{font:400 13px var(--f-body);color:var(--muted);opacity:0;animation:fin .5s ease 1.1s forwards;max-width:90vw}
@keyframes lt{to{opacity:1;transform:none}}

/* ---- theme: civil ---- */
html[data-th=civil] body{background-color:var(--bg);background-image:linear-gradient(rgba(120,180,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,180,255,.06) 1px,transparent 1px),linear-gradient(rgba(120,180,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(120,180,255,.12) 1px,transparent 1px);background-size:20px 20px,20px 20px,100px 100px,100px 100px;background-attachment:fixed}
html[data-th=civil] header.top{position:sticky;border-bottom:0;padding-bottom:6px}
html[data-th=civil] header.top::after{content:'';position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(-45deg,#ffc82e 0 12px,#10202e 12px 24px)}
html[data-th=civil] .brand{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:18px;display:flex;flex-direction:column;align-items:flex-start;position:relative;padding-right:34px}
html[data-th=civil] .brand .bn{color:var(--ink)}
html[data-th=civil] .brand small{font-family:var(--f-body);font-weight:400;text-transform:none;letter-spacing:0;font-size:12px;color:var(--accent)}
html[data-th=civil] .brandedit{position:absolute;right:0;top:0;border:1px solid var(--line);background:transparent;color:var(--accent);border-radius:2px;width:26px;height:26px;font-size:13px;padding:0}
html[data-th=civil] .brandedit:hover{border-color:var(--accent)}
html[data-th=civil] .tab{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-radius:2px;padding:7px 14px;color:var(--muted)}
html[data-th=civil] .tab:hover{background:var(--surface2);color:var(--ink)}
html[data-th=civil] .tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);clip-path:none}
html[data-th=civil] .tab.add{border:1px dashed var(--line);color:var(--accent)}
html[data-th=civil] h1,html[data-th=civil] h2,html[data-th=civil] h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;font-style:normal}
html[data-th=civil] h2{font-size:17px;font-weight:600}
html[data-th=civil] .sec>.head h2{padding-left:10px;border-left:4px solid var(--accent)}
html[data-th=civil] .card{border-radius:2px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
html[data-th=civil] .wc:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 22px rgba(0,0,0,.25)}
html[data-th=civil] .btn{border-radius:2px;background:var(--surface2);font-weight:500}
html[data-th=civil] .btn:hover{border-color:var(--accent);color:var(--accent)}
html[data-th=civil] .btn.pri{background:var(--accent);color:var(--accent-ink);font-weight:600;border-color:var(--accent)}
html[data-th=civil] .btn.pri:hover{color:var(--accent-ink);filter:brightness(1.07)}
html[data-th=civil] .chip{border-radius:2px;background:var(--surface2);font-family:var(--f-display);font-style:normal;font-weight:500;color:var(--muted)}
html[data-th=civil] .chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
html[data-th=civil] .big{font-family:var(--f-mono);font-style:normal;font-size:30px;font-weight:600;letter-spacing:-.02em}
html[data-th=civil] .m .v,html[data-th=civil] .pc span{font-family:var(--f-mono);font-style:normal;font-weight:600;font-size:13.5px}
html[data-th=civil] td{font-family:var(--f-mono);font-size:13.5px}
html[data-th=civil] td:first-child{font-family:var(--f-body)}
html[data-th=civil] thead th{text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-display);font-size:11.5px;background:var(--surface2)}
html[data-th=civil] tr.wk td{background:var(--surface2);color:var(--accent)}
html[data-th=civil] .bar{height:8px;border-radius:0;background:linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px) 0 0/10% 100%,var(--track)}
html[data-th=civil] .bar>i{border-radius:0}
html[data-th=civil] .stack{height:12px;border-radius:0}
html[data-th=civil] .hc{font-family:var(--f-mono);font-style:normal;font-size:16px;border-radius:2px}
html[data-th=civil] .ring text{font-style:normal}
html[data-th=civil] .c{border-radius:2px;font-family:var(--f-mono)}
html[data-th=civil] .gf{background:var(--surface);color:var(--accent);font-family:var(--f-display);font-style:normal}
html[data-th=civil] .tw,html[data-th=civil] .brush{background:var(--surface);border-radius:2px}
html[data-th=civil] .brush{border-color:var(--accent)}
html[data-th=civil] .bchip{border-radius:2px}
html[data-th=civil] .bchip[aria-pressed=true]{border-color:var(--accent);box-shadow:none}
html[data-th=civil] #modal{background:rgba(3,15,30,.72);backdrop-filter:blur(3px)}
html[data-th=civil] .sheet{border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:2px}
html[data-th=civil] .opt{background:var(--surface2);border-radius:2px}
html[data-th=civil] .opt:hover{border-color:var(--accent)}

function hex3(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return [n>>16,(n>>8)&255,n&255]}
function mixc(k,p){try{const a=hex3(cvar('--'+k)),b=hex3(cvar('--surface')),t=(8+p*82)/100;return 'rgb('+a.map((x,i)=>Math.round(x*t+b[i]*(1-t))).join(',')+')'}catch(e){return 'var(--surface2)'}}
function lum(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f((n>>8)&255)+.0722*f(n&255)}

function drawAppIcon(cv,size,o){cv.width=cv.height=size;const x=cv.getContext('2d'),u=size/100;x.fillStyle=o.bg;x.fillRect(0,0,size,size);
  if(o.style==='letter'){x.fillStyle=o.fg;x.font=`italic 800 ${u*(o.letter.length>1?52:68)}px "Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(o.letter,size/2,size*.54);return}
  const rows=[.95,.72,.5,.28],W=62,H=10,gap=6.5,x0=(100-W)/2,y0=(100-(rows.length*H+(rows.length-1)*gap))/2;
  rows.forEach((f,i)=>{const y=y0+i*(H+gap),r=H/2;x.fillStyle=o.tk;x.beginPath();x.roundRect(x0*u,y*u,W*u,H*u,r*u);x.fill();x.fillStyle=o.fg;x.beginPath();x.roundRect(x0*u,y*u,Math.max(H,W*f)*u,H*u,r*u);x.fill()})}

const dim=()=>cvar('--dim')||'#c4c9c4';

const gridsOf=(wid,b)=>Object.entries(S.grids).map(([id,g])=>({id,...g})).filter(g=>g.work===wid&&(!b||b==='ALL'||g.building===b)).sort((a,b)=>(a.order||0)-(b.order||0)||a.id.localeCompare(b.id));
function sIdx(w,name){const i=(w.statuses||[]).findIndex(s=>s.name===name);return i<0?0:i}
function msIdx(w,k){const id=(w.milestones||{})[k];if(!id)return null;const i=(w.statuses||[]).findIndex(s=>s.id===id);return i<0?null:i}
function tally(w,grids){const n=(w.statuses||[]).length;const c=new Array(n).fill(0);let t=0,pt=0,pd=0;
  for(const g of grids)for(const v of Object.values(g.cells||{})){if(!has(v))continue;
    if(g.kind==='percent'){pt++;pd+=Math.max(0,Math.min(100,+v||0))/100}else{c[sIdx(w,v)]++;t++}}
  return {c,t,pt,pd,n:t+pt}}
function pcts(w,tl){const o={};for(const [k] of MS){const m=msIdx(w,k);const den=k==='done'?tl.n:tl.t;o[k]=(m==null||!den)?null:(tl.c.slice(m).reduce((a,b)=>a+b,0)+(k==='done'?tl.pd:0))/den}return o}
const fmt=p=>p==null?'–':(p*100>=99.95||p===0?Math.round(p*100):(p*100).toFixed(1))+'%';
function pbar(p,col){return `<div class="pc"><div class="bar"><i style="width:${p==null?0:p*100}%;background:${col}"></i></div><span class="${p==null?'na':''}">${fmt(p)}</span></div>`}
function ring(p,col,label,sub){const r=52,C=2*Math.PI*r,v=p==null?0:Math.max(0,Math.min(1,p));
  return `<div class="ring"><svg viewBox="0 0 130 130" role="img" aria-label="${esc(label)} ${fmt(p)}"><circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--track)" stroke-width="13"/><circle cx="65" cy="65" r="${r}" fill="none" stroke="${col}" stroke-width="13" ${v>0?'stroke-linecap="round"':'stroke-opacity="0"'} stroke-dasharray="${v*C} ${C}" style="--rl:${v*C}px" transform="rotate(-90 65 65)"/><text x="65" y="72" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-weight="700" font-size="26" fill="var(--ink)">${p==null?'–':Math.round(p*100)+'%'}</text></svg><div class="t">${esc(label)}</div><div class="n">${esc(sub)}</div></div>`}
function stackBar(w,tl){const pv=tl.pt?`<div class="legend"><span>รายการแบบ % เฉลี่ย <b>${fmt(tl.pd/tl.pt)}</b> (${tl.pt} ช่อง)</span></div>`:'';if(!tl.t)return pv;return `<div class="stack">${(w.statuses||[]).map((s,i)=>tl.c[i]?`<i title="${esc(s.name)} ${tl.c[i]}" style="width:${tl.c[i]/tl.t*100}%;background:${sc(s.color)}"></i>`:'').join('')}</div>
 <div class="legend">${(w.statuses||[]).map((s,i)=>`<span><span class="sw" style="background:${sc(s.color)}"></span>${esc(s.name)} <b>${tl.c[i]}</b></span>`).join('')}</div>`+pv}

/* ---------- aggregate ---------- */
function overall(b){const agg={done:[0,0],cm:[0,0],qc2:[0,0]};let units=0;
  for(const w of worksSorted()){const gs=gridsOf(w.id,b),tl=tally(w,gs);units+=tl.n;
    for(const [k] of MS){const m=msIdx(w,k);if(m==null)continue;agg[k][0]+=tl.c.slice(m).reduce((a,x)=>a+x,0)+(k==='done'?tl.pd:0);agg[k][1]+=(k==='done'?tl.n:tl.t)}}
  const o={units};for(const [k] of MS)o[k]=agg[k][1]?agg[k][0]/agg[k][1]:null;o.n=agg;return o}

const rowName=r=>typeof r==='number'?esc(fname(r)):esc(r);
const fmChips=()=>`<div class="chips">${MS.map(([k,l])=>`<button class="chip" data-a="fm" data-k="${k}" aria-pressed="${S.fm===k}">${l}</button>`).join('')}</div>`;
function floorTable(w,gs){const m=S.fm,rows=floorKeys(gs);if(!rows.length)return '';
  const names=[...new Set(gs.map(g=>g.item))];
  const cell=tl=>`<td>${tl.n?pbar(pcts(w,tl)[m],MSCOL[m]):'<span class="na">–</span>'}</td>`;
  const body=rows.map(r=>`<tr><td>${rowName(r)}</td>${names.map(n=>cell(tally(w,gridsAtRow(gs.filter(g=>g.item===n),r)))).join('')}${cell(tally(w,gridsAtRow(gs,r)))}</tr>`).join('');
  return `<section class="sec"><div class="head"><h2>% แยกตามชั้น</h2>${fmChips()}</div><div class="tw"><table class="ft"><thead><tr><th>ชั้น</th>${names.map(n=>`<th>${esc(n)}</th>`).join('')}<th>รวมทุกรายการ</th></tr></thead><tbody>${body}</tbody></table></div></section>`}
function floorOverview(b){const ws=worksSorted(),m=S.fm,per=ws.map(w=>({w,gs:gridsOf(w.id,b)})),rows=floorKeys(per.flatMap(x=>x.gs));if(!rows.length)return '';
  const body=rows.map(r=>{let num=0,den=0;
    const tds=per.map(({w,gs})=>{const tl=tally(w,gridsAtRow(gs,r)),mi=msIdx(w,m);
      if(mi!=null){num+=tl.c.slice(mi).reduce((a,x)=>a+x,0)+(m==='done'?tl.pd:0);den+=(m==='done'?tl.n:tl.t)}
      return `<td>${tl.n?pbar(pcts(w,tl)[m],MSCOL[m]):'<span class="na">–</span>'}</td>`}).join('');
    return `<tr><td>${rowName(r)}</td>${tds}<td>${den?pbar(num/den,MSCOL[m]):'<span class="na">–</span>'}</td></tr>`}).join('');
  return `<section class="sec"><div class="head"><h2>% แยกตามชั้น</h2>${fmChips()}<span class="sub">แต่ละงาน ตามชั้นของตึกที่เลือก</span></div><div class="tw"><table class="ft"><thead><tr><th>ชั้น</th>${ws.map(w=>`<th>${esc(w.name)}</th>`).join('')}<th>รวมทุกงาน</th></tr></thead><tbody>${body}</tbody></table></div></section>`}
/* ---------- QC2 page: a room is ready for QC2 only when every item in it has passed CM ---------- */
const QCS={no:['#c4c9c4','·','ยังไม่ผ่าน'],wait:['#2f7fb8','✓','ผ่าน CM ครบ รอ QC2'],open:['#8a6fc4','Q○','QC2 OPEN'],close:['#25936a','Q●','QC2 CLOSE']};
Object.defineProperty(QCS.no,0,{get:()=>dim(),set:()=>{},configurable:true});
const qcWorks=()=>worksSorted().filter(w=>msIdx(w,'cm')!=null);
function qcRooms(w,b){const ci=msIdx(w,'cm'),qi=msIdx(w,'qc2'),rooms=new Map();
  for(const g of gridsOf(w.id,b)){if(g.kind==='percent'||g.rowLabel)continue;
    for(const [k,v] of Object.entries(g.cells||{})){if(!has(v))continue;const j=k.indexOf('-'),f=+k.slice(0,j),c=k.slice(j+1),key=g.building+'|'+k;
      let r=rooms.get(key);if(!r){r={b:g.building,f,c,k,items:[]};rooms.set(key,r)}
      r.items.push({n:g.item,o:g.order||0,i:sIdx(w,v),s:v})}}
  for(const r of rooms.values()){r.items.sort((a,b)=>a.o-b.o);r.miss=r.items.filter(x=>x.i<ci);
    r.st=r.miss.length?'no':(qi!=null&&r.items.every(x=>x.i>=qi))?'close':r.items.some(x=>x.i>ci)?'open':'wait'}
  return rooms}
const qcCount=rs=>{const o={t:rs.length,no:0,wait:0,open:0,close:0};rs.forEach(r=>o[r.st]++);o.pass=o.t-o.no;return o};
function qcMap(w,bl,rooms){const rs=rooms.filter(r=>r.b===bl);if(!rs.length)return '';
  const cols=[];gridsOf(w.id,bl).forEach(g=>{if(g.kind==='percent'||g.rowLabel)return;(g.cols||[]).forEach(c=>{if(!cols.includes(c))cols.push(c)})});
  const floors=[...new Set(rs.map(r=>r.f))].sort((a,b)=>b-a),map=new Map(rs.map(r=>[r.f+'-'+r.c,r])),n=qcCount(rs);
  let h=`<section class="card item sec" style="margin-top:16px"><div class="hd"><h3>ตึก ${esc(bl)}</h3><span class="sub">ผ่าน CM ครบ <b style="color:var(--ink)">${n.pass}</b> / ${n.t} ห้อง · QC2 CLOSE ${n.close}</span></div>
   <div class="gw"><div class="g" style="grid-template-columns:34px repeat(${cols.length},32px)"><span></span>${cols.map(c=>`<span class="gh">${esc(c)}</span>`).join('')}`;
  for(const f of floors){h+=`<span class="gf">ชั้น ${f}</span>`;
    for(const c of cols){const r=map.get(f+'-'+c);
      if(!r)h+=`<span class="c none"></span>`;
      else{const q=QCS[r.st];h+=`<button class="c" data-a="qroom" data-b="${esc(bl)}" data-k="${esc(r.k)}" title="ห้อง ${esc(c)} ชั้น ${f}: ${q[2]}" aria-label="ห้อง ${esc(c)} ชั้น ${f}: ${q[2]}" style="background:${q[0]};color:${fg(q[0])}">${q[1]}</button>`}}}
  return h+`</div></div><div class="glg"><b style="color:var(--ink)">สีสถานะห้อง</b>${['no','wait','open','close'].map(k=>`<span class="k"><i style="background:${QCS[k][0]};color:${fg(QCS[k][0])}">${QCS[k][1]}</i>${QCS[k][2]}</span>`).join('')}<span class="k"><span class="nn"></span>ไม่มีห้อง</span></div></section>`}
function qroomSheet(w,r){const ci=msIdx(w,'cm'),q=QCS[r.st];
  modal(`<h2>ตึก ${esc(r.b)} · ชั้น ${r.f} · ห้อง ${esc(r.c)}</h2>
   <div class="chip" style="align-self:flex-start;background:${q[0]};color:${fg(q[0])};border-color:${q[0]};font-weight:600">${q[2]}</div>
   ${r.miss.length?`<div class="sub">ยังไม่ผ่าน CM: ${r.miss.map(x=>esc(x.n)).join(', ')}</div>`:'<div class="sub">ทุกรายการผ่าน CM แล้ว</div>'}
   ${r.items.map(x=>{const s=w.statuses[x.i]||{color:'#ccc'};return `<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span>${esc(x.n)}</span><span class="chip" style="background:${sc(s.color)};color:${fg(sc(s.color))};border-color:${sc(s.color)};white-space:nowrap">${esc(x.s)}</span></div>`}).join('')}
   <button class="btn" data-x>ปิด</button>`,el=>{el.onclick=e=>{if(e.target.closest('[data-x]'))closeM()}})}
function vQC2(){
  const ws=qcWorks();if(!ws.length)return `<div class="card empty">ยังไม่มีงานที่ตั้งขั้น CM CLOSE ไว้ ตั้งค่าได้ที่ “ตั้งค่างาน” ของแต่ละงาน</div>`;
  const w=ws.find(x=>x.id===S.qw)||ws[0];S.qw=w.id;const b=S.qb,all=[...qcRooms(w,b).values()],n=qcCount(all);
  let h=`<div class="row" style="justify-content:space-between"><div><h1 style="font-size:22px;font-weight:700">QC2 ผ่านหรือยังไม่ผ่าน</h1><div class="sub">ห้องจะผ่านเมื่อทุกรายการของ${esc(w.name)}ในห้องนั้นเป็น CM CLOSE ขึ้นไป จึงพร้อมส่ง QC2 ได้</div></div>
   <div class="row noexp"><button class="btn sm" data-a="exp">ส่งออก PDF / ภาพ</button></div></div>
   <div class="row" style="margin-top:12px">${ws.length>1?`<div class="chips">${ws.map(x=>`<button class="chip" data-a="qw" data-w="${x.id}" aria-pressed="${x.id===w.id}">${esc(x.name)}</button>`).join('')}</div>`:''}${bldChips(b,'qb')}</div>`;
  if(!n.t)return h+`<div class="card empty" style="margin-top:16px">ยังไม่มีข้อมูลห้องของ${esc(w.name)}${b==='ALL'?'':'ในตึกนี้'}</div>`;
  const p=n.pass/n.t;
  h+=`<section class="sec"><div class="qs">
    <div class="card"><span class="lb">ห้องทั้งหมด</span><span class="big">${n.t.toLocaleString('th-TH')}</span></div>
    <div class="card"><span class="lb">ผ่าน CM ครบ (พร้อม QC2)</span><span class="big" style="color:var(--cm)">${n.pass.toLocaleString('th-TH')} <span style="font-size:15px">· ${fmt(p)}</span></span></div>
    <div class="card"><span class="lb">ยังไม่ผ่าน</span><span class="big" style="color:var(--warn)">${n.no.toLocaleString('th-TH')}</span></div>
    <div class="card"><span class="lb">QC2 CLOSE</span><span class="big" style="color:var(--qc2)">${n.close.toLocaleString('th-TH')}</span></div></div>
   <div class="card"><div class="stack">${['no','wait','open','close'].map(k=>n[k]?`<i title="${QCS[k][2]} ${n[k]}" style="width:${n[k]/n.t*100}%;background:${QCS[k][0]}"></i>`:'').join('')}</div>
    <div class="qleg" style="margin-top:8px">${['no','wait','open','close'].map(k=>`<span><span class="sw" style="background:${QCS[k][0]}"></span>${QCS[k][2]} <b style="color:var(--ink)">${n[k]}</b></span>`).join('')}</div></div></section>`;
  const groups=b==='ALL'?S.meta.buildings.filter(x=>all.some(r=>r.b===x)).map(x=>[ 'ตึก '+x,all.filter(r=>r.b===x)]):[...new Set(all.map(r=>r.f))].sort((a,c)=>c-a).map(f=>['ชั้น '+f,all.filter(r=>r.f===f)]);
  h+=`<section class="sec"><div class="head"><h2>ตารางสรุป ${b==='ALL'?'รายตึก':'รายชั้น ตึก '+esc(b)}</h2></div><div class="tw"><table><thead><tr><th>${b==='ALL'?'ตึก':'ชั้น'}</th><th>ห้อง</th><th>ผ่าน CM ครบ</th><th>% ผ่าน</th><th>ยังไม่ผ่าน</th><th>QC2 OPEN</th><th>QC2 CLOSE</th></tr></thead><tbody>${groups.map(([l,rs])=>{const c=qcCount(rs);return `<tr><td>${esc(l)}</td><td>${c.t}</td><td>${c.pass}</td><td>${pbar(c.pass/c.t,'var(--cm)')}</td><td>${c.no}</td><td>${c.open}</td><td>${c.close}</td></tr>`}).join('')}</tbody></table></div></section>`;
  h+=`<section class="sec"><div class="head"><h2>แผนผังห้อง</h2><span class="sub">กดห้องเพื่อดูว่ารายการไหนยังไม่ผ่าน</span></div></section>`;
  h+=(b==='ALL'?S.meta.buildings:[b]).map(x=>qcMap(w,x,all)).join('');
  return h}

function tableRows(b){const out=[];
  for(const w of worksSorted()){const gs=gridsOf(w.id,b),tl=tally(w,gs),p=pcts(w,tl);

    const names=[...new Set(gs.map(g=>g.item))];
    for(const n of names){const ig=gs.filter(g=>g.item===n),it=tally(w,ig),ip=pcts(w,it);
      out.push({w:w.name,item:n,t:it.n,p:ip,html:`<tr class="it"><td>${esc(n)}</td><td>${it.n.toLocaleString('th-TH')}</td>${MS.map(([k])=>cell(k,ip)).join('')}</tr>`})}}
  return out}

function vWork(w){

   <div style="display:flex;flex-direction:column;gap:8px;justify-content:center">${tl.n?stackBar(w,tl):'<div class="sub">ยังไม่มีรายการในตึกนี้</div>'}</div></div>`;

  h+=`</section>`;
  h+=floorTable(w,gs);
  if(S.canWrite&&gs.some(g=>g.kind!=='percent')){h+=`<div class="sec noexp"><div class="brush"><span class="lbl">แปรงสถานะ</span>${(w.statuses||[]).map(s=>`<button class="bchip" data-a="brush" data-s="${esc(s.name)}" aria-pressed="${S.brush===s.name}" style="background:${sc(s.color)};color:${fg(sc(s.color))}">${esc(s.name)}</button>`).join('')}<button class="bchip" data-a="brush" data-s="" aria-pressed="${S.brush==null}" style="background:var(--surface2)">เลือกทีละช่อง</button></div></div>`}
  if(!gs.length)h+=`<div class="card empty" style="margin-top:16px">ยังไม่มีรายการ${b==='ALL'?'':'ในตึก '+esc(b)} ${S.canWrite?'กด “+ เพิ่มรายการ” เพื่อสร้างตารางชั้น × ห้อง':''}</div>`;
  for(const g of gs)h+=gridCard(w,g,b==='ALL');

function pctColor(v){const a=hex3(dim()),b=[37,147,106],t=v/100;return '#'+a.map((x,i)=>Math.round(x+(b[i]-x)*t).toString(16).padStart(2,'0')).join('')}
function gridCard(w,g,showB){
  const tl=tally(w,[g]),p=pcts(w,tl),cols=g.cols||[],fl=g.floors||[];
  let h=`<section class="card item sec" style="margin-top:16px"><div class="hd"><h3>${showB?`<span class="sub" style="margin-right:6px">ตึก ${esc(g.building)}</span>`:''}${esc(g.item)}</h3>
   <span class="sub">${MS.map(([k,l])=>p[k]==null?'':`${l} <b style="color:var(--ink)">${fmt(p[k])}</b>`).filter(Boolean).join(' · ')}</span>
   <span class="row noexp" style="gap:6px"><button class="btn sm" data-a="exp" data-g="${g.id}">ส่งออก</button>${S.canWrite?`<button class="btn sm" data-a="gmenu" data-g="${g.id}">จัดการ</button>`:''}</span></div>
   <div class="gw" data-gw="${g.id}"><div class="g" style="grid-template-columns:${g.rowLabel||g.struct?'84px':'34px'} repeat(${cols.length},${g.cw||32}px)"><span></span>${cols.map(c=>`<button class="gh" data-a="colset" data-g="${g.id}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}`;
  for(const f of fl){h+=`<button class="gf" data-a="floorset" data-g="${g.id}" data-f="${f}">${esc(g.rowLabel||(g.struct?fname(f):'ชั้น '+f))}</button>`;
    for(const c of cols){const k=f+'-'+c,v=(g.cells||{})[k];
      if(!has(v))h+=`<button class="c none" data-a="cell" data-g="${g.id}" data-k="${esc(k)}" aria-label="ไม่มีห้อง ${esc(c)} ชั้น ${f}"></button>`;
      else if(g.kind==='percent'){const pv=Math.max(0,Math.min(100,+v||0)),col=pctColor(pv);
        h+=`<button class="c" data-a="cell" data-g="${g.id}" data-k="${esc(k)}" title="${esc(c)} ${esc(g.rowLabel||(g.struct?fname(f):'ชั้น '+f))}: ${pv}%" aria-label="${esc(c)} ${esc(g.rowLabel||(g.struct?fname(f):'ชั้น '+f))}: ${pv}%" style="background:${col};color:${fg(col)}">${Math.round(pv*10)/10}${(g.cw||32)>40?'%':''}</button>`}
      else{const i=sIdx(w,v),s=(w.statuses||[])[i]||{color:'#ccc',name:v};
        h+=`<button class="c${isCust(g.building,f,c)?' cust':''}" data-a="cell" data-g="${g.id}" data-k="${esc(k)}" title="${isCust(g.building,f,c)?'★ ห้องลูกค้า · ':''}ห้อง ${esc(c)} ชั้น ${f}: ${esc(s.name)}" aria-label="ห้อง ${esc(c)} ชั้น ${f}: ${esc(s.name)}" style="background:${sc(s.color)};color:${fg(sc(s.color))}">${esc(s.short||s.name.slice(0,2))}</button>`}}}
  return h+`</div></div>${gridLegend(w,g)}</section>`}
function gridLegend(w,g){
  const none=`<span class="k"><span class="nn"></span>ไม่มีห้อง</span>`;
  if(g.kind==='percent')return `<div class="glg"><b style="color:var(--ink)">สีแสดง % ที่เสร็จ</b><span class="k">0%<span class="gr"></span>100%</span>${none}</div>`;

function renderTabs(){const t=$('#tabs');
  t.innerHTML=`<button class="tab" role="tab" data-a="go" data-v="overview" aria-selected="${S.view==='overview'}">ภาพรวม</button>`+(Object.keys(PLANS).length?`<button class="tab" role="tab" data-a="go" data-v="plan" aria-selected="${S.view==='plan'}">แปลน</button>`:'')+`<button class="tab" role="tab" data-a="go" data-v="sched" aria-selected="${S.view==='sched'}">แผนงาน</button><button class="tab" role="tab" data-a="go" data-v="design" aria-selected="${S.view==='design'}">ออกแบบ</button>`+(qcWorks().length?`<button class="tab" role="tab" data-a="go" data-v="qc2" aria-selected="${S.view==='qc2'}">QC2</button>`:'')+worksSorted().map(w=>`<button class="tab" role="tab" data-a="go" data-v="${w.id}" aria-selected="${S.view===w.id}">${esc(w.name)}</button>`).join('')+(S.canWrite?`<button class="tab add" data-a="addwork">+ เพิ่มงาน</button>`:'')}
let raf=0;function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(doRender)}
function doRender(){
  if(S._drag){S._pend=true;return}
  const app=$('#app');if(!S.ready)return;applyBrand();
  const sc={};app.querySelectorAll('[data-gw]').forEach(e=>sc[e.dataset.gw]=e.scrollLeft);
  renderTabs();
  let h='';
  if(S.loadErr)h+=`<div class="banner">โหลดข้อมูลไม่สำเร็จ: ${esc(S.loadErr)}</div>`;
  else if(!S.canWrite)h+=`<div class="banner">โหมดดูอย่างเดียว กด “เข้าสู่ระบบ / ตั้งค่า” ที่มุมขวาบนเพื่อเข้าสู่ระบบและแก้ไขข้อมูล</div>`;
  const w=S.works[S.view];
  if(S.view==='plan')h+=vPlan();
  else if(S.view==='sched')h+=vSched();
  else if(S.view==='design')h+=vDesign();
  else if(S.view==='qc2')h+=vQC2();
  else if(S.view!=='overview'&&w)h+=vWork({id:S.view,...w});else{S.view='overview';h+=vOverview()}
  const key=S.view+'|'+S.pb+'|'+S.pf+'|'+S.pw+'|'+S.pm+'|'+S.bld+'|'+S.obld+'|'+S.qw+'|'+S.qb;const ent=key!==S._k;S._k=key;
  app.classList.remove('enter');app.innerHTML=h;
  if(ent&&S.view==='plan'){app.querySelectorAll('[data-v]').forEach(e=>{if(!e.matches('.prp,#ptot'))return;const v=e.dataset.v;if(v==='')return;const t=+v,t0=performance.now();const step=n=>{const k=Math.min(1,(n-t0)/900),x=t*(1-Math.pow(1-k,3));e.textContent=fmt(x);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
  if(S.view==='plan'){planApply(ent);setTimeout(planLead,480);const ck=app.querySelector('.callout');const k=ck?ck.dataset.ck:'';if(k&&k!==S._ck){app.querySelectorAll('.cop').forEach(e=>{const v=e.dataset.v;if(v==='')return;const t=+v,t0=performance.now();const st=n=>{const q=Math.min(1,(n-t0)/800);e.textContent=fmt(t*(1-Math.pow(1-q,3)));if(q<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}S._ck=k}
  if(ent){void app.offsetWidth;app.classList.add('enter');clearTimeout(S._et);S._et=setTimeout(()=>app.classList.remove('enter'),1400);window.scrollTo({top:0})}
  app.querySelectorAll('[data-gw]').forEach(e=>{if(sc[e.dataset.gw])e.scrollLeft=sc[e.dataset.gw]})}

/* ---------- writes ---------- */
const queue={};
function patchCells(gid,patch){const g=S.grids[gid];if(!g)return;
  patch={...patch};for(const k in patch)if(patch[k]==null)patch[k]='-';
  S.grids[gid]={...g,cells:{...(g.cells||{}),...patch}};
  const q=queue[gid]||(queue[gid]={p:{},run:false});Object.assign(q.p,patch);
  render();flush(gid)}
async function flush(gid){const q=queue[gid];if(q.run)return;q.run=true;
  try{while(Object.keys(q.p).length){const p=q.p;q.p={};
    await S.db.doc('grids/'+gid).update({cells:p})}}
  catch(e){toast('บันทึกไม่สำเร็จ: '+(e&&e.code||'error'));console.error(e)}
  q.run=false}
const setDoc=(path,data)=>S.db.doc(path).set(data).catch(e=>{toast('บันทึกไม่สำเร็จ: '+(e&&e.code||'error'));throw e});

/* ---------- modal ---------- */
function modal(html,bind){const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;
  m.onclick=e=>{if(e.target===m)closeM()};bind&&bind(m.firstChild)}
function closeM(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
function pick(title,sub,w,onPick,allowNone){
  modal(`<h2>${esc(title)}</h2><div class="sub">${esc(sub||'')}</div>${(w.statuses||[]).map((s,i)=>`<button class="opt" data-i="${i}"><span class="sw" style="background:${sc(s.color)}"></span>${esc(s.name)}</button>`).join('')}${allowNone?`<button class="opt" data-i="-1"><span class="sw" style="background:transparent;border:1px dashed var(--muted)"></span>ไม่มีห้อง/ไม่นับ</button>`:''}<button class="btn" data-x>ยกเลิก</button>`,
   el=>{el.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-x'))return closeM();
     const i=+b.dataset.i;closeM();onPick(i<0?null:w.statuses[i].name)}})}
function pickPct(title,sub,onPick,allowNone){
  modal(`<h2>${esc(title)}</h2><div class="sub">${esc(sub||'')}</div>
   <div class="row">${[0,25,50,75,100].map(v=>`<button class="btn" data-v="${v}">${v}%</button>`).join('')}</div>
   <div class="field"><label for="pp_v">ระบุเอง (0–100)</label><input id="pp_v" type="number" min="0" max="100" step="0.1" inputmode="decimal"></div>
   <div class="row"><button class="btn pri" data-set>ตั้งค่า</button>${allowNone?'<button class="btn" data-none>ไม่มีช่องนี้</button>':''}<button class="btn" data-x>ยกเลิก</button></div>`,
   el=>{const f=$('#pp_v');f.focus();
     el.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-x'))return closeM();
       if(b.hasAttribute('data-none')){closeM();return onPick(null)}
       let v=b.dataset.v!=null?+b.dataset.v:parseFloat(f.value);
       if(!isFinite(v))return toast('ใส่ตัวเลข 0–100');
       closeM();onPick(Math.max(0,Math.min(100,Math.round(v*10)/10)))}})}
function pickFor(g,title,sub,w,cb,none){return g.kind==='percent'?pickPct(title,sub,cb,none):pick(title,sub,w,cb,none)}
function confirmM(text,ok){modal(`<h2>ยืนยัน</h2><div>${esc(text)}</div><div class="row"><button class="btn danger" data-ok>ยืนยัน</button><button class="btn" data-x>ยกเลิก</button></div>`,el=>{el.onclick=e=>{const b=e.target.closest('button');if(!b)return;closeM();if(b.hasAttribute('data-ok'))ok()}})}

function buildClone(t,title){
  const scope=document.createElement('div');scope.className='expscope';
  const src=t.g?document.querySelector(`[data-gw="${CSS.escape(t.g)}"]`).closest('section'):$('#app');
  const c=src.cloneNode(true);c.removeAttribute('id');
  c.querySelectorAll('.noexp,.banner').forEach(e=>e.remove());
  const date=new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
  const hd=document.createElement('div');hd.className='exphead';hd.innerHTML=`<b>${esc(S.meta.name)}</b> · ${esc(title)} · ข้อมูล ณ ${date}`;
  const LT={done:[227,168,43],cm:[47,127,184],qc2:[37,147,106]};
  c.querySelectorAll('.hc[data-hp]').forEach(e=>{const p=+e.dataset.hp,a=LT[e.dataset.hk],t=(8+p*82)/100;e.style.background='rgb('+a.map(x=>Math.round(x*t+255*(1-t))).join(',')+')';e.style.color=p>.6?'#fff':'#15222a'});
  const DIMRGB='rgb('+hex3(dim()).join(', ')+')';
  c.querySelectorAll('[style]').forEach(e=>{if(e.style.backgroundColor===DIMRGB){e.style.backgroundColor='#c4c9c4';e.style.color='#14212a'}});
  scope.append(hd,c);document.body.appendChild(scope);
  const wide=Math.max(0,...[...scope.querySelectorAll('.g')].map(g=>g.scrollWidth));
  scope.style.width=Math.max(t.g?640:1100,wide+80)+'px';
  return scope}
async function runExport(t,title,o){
  if(!window.html2canvas||!(window.jspdf&&window.jspdf.jsPDF))return toast('โหลดตัวช่วยส่งออกไม่สำเร็จ ลองรีเฟรชหน้า');
  if(!S.dl)return toast('ส่งออกไฟล์ไม่ได้ในมุมมองนี้');
  toast('กำลังสร้างไฟล์…');
  const scope=buildClone(t,title);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const sr=scope.getBoundingClientRect();
    const units=[...scope.querySelectorAll('tr,.hero,.wc,.heat,.ring,section.item,.sec>.card,.exphead')].map(e=>{const r=e.getBoundingClientRect();return [r.top-sr.top,r.bottom-sr.top]});
    scope.querySelectorAll('h2,.sec>.head').forEach(e=>{const r=e.getBoundingClientRect();units.push([r.top-sr.top,r.bottom-sr.top+90])});
    const cssW=scope.offsetWidth,cssH=scope.offsetHeight,sc=Math.max(.5,Math.min(2,14000/cssW,14000/cssH));
    const cv=await html2canvas(scope,{scale:sc,backgroundColor:'#edf0ed',useCORS:true,logging:false});
    const day=new Date().toISOString().slice(0,10),slug=title.replace(/[^\w฀-๿-]+/g,'_');
    if(o.fmt==='png'){
      const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
      await S.dl.save({filename:`modeva-${slug}-${day}.png`,data:blob})
    }else{
      const pdf=new window.jspdf.jsPDF({orientation:o.orient,unit:'mm',format:o.size.toLowerCase()});
      const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight(),m=8,aw=W-2*m,ah=H-2*m;
      const mmPerCss=Math.min(aw/cssW,.2646*1.5),cap=ah/mmPerCss;
      const cuts=[0];let y0=0;
      while(cssH-y0>cap+1){let y=y0+cap;
        for(let g=0;g<60;g++){const u=units.find(([t,bt])=>t+1<y&&y<bt-1);if(!u)break;y=u[0]}
        if(y<y0+cap*.35)y=y0+cap;
        cuts.push(y);y0=y}
      cuts.push(cssH);
      const N=cuts.length-1;
      for(let i=0;i<N;i++){
        const sy=Math.round(cuts[i]*sc),h=Math.max(1,Math.min(cv.height-sy,Math.round((cuts[i+1]-cuts[i])*sc))),pc=document.createElement('canvas');pc.width=cv.width;pc.height=h;
        const cx=pc.getContext('2d');cx.fillStyle='#edf0ed';cx.fillRect(0,0,pc.width,h);cx.drawImage(cv,0,sy,cv.width,h,0,0,cv.width,h);
        if(i)pdf.addPage();
        pdf.addImage(pc.toDataURL('image/jpeg',.92),'JPEG',m,m,cv.width*mmPerCss/sc,h*mmPerCss/sc);
        pdf.setFontSize(8);pdf.setTextColor(120);pdf.text(S.meta.name.replace(/[^\x20-\x7e]/g,'')+'  '+(i+1)+' / '+N,W-m,H-3.5,{align:'right'})}
      await S.dl.save({filename:`modeva-${slug}-${day}.pdf`,data:pdf.output('blob')})}
    toast('ส่งออกแล้ว')
  }catch(err){if(!err||err.code!=='declined'){toast('ส่งออกไม่สำเร็จ');console.error(err)}}
  finally{scope.remove()}}

const clone=x=>JSON.parse(JSON.stringify(x));
const isSb=()=>GH.cfg.mode==='supabase';
function ghLoadCfg(){

function updBtn(){const b=$('#ghbtn');if(!b)return;b.textContent=ghReady()?(isSb()?'Supabase: '+((SBUSER&&SBUSER.email)||'เข้าสู่ระบบแล้ว'):'GitHub: เชื่อมแล้ว'):'เข้าสู่ระบบ / ตั้งค่า'}
function sbInit(){

  SB=window.supabase.createClient(GH.cfg.sbUrl,GH.cfg.sbKey,{auth:{persistSession:true,autoRefreshToken:true}});

function sbRealtime(){if(SBCH||!SB)return;
  SBCH=SB.channel('docs-sync').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.col)return;
    const d=GH.data;d[r.col]=d[r.col]||{};
    if(p.eventType==='DELETE')delete d[r.col][r.id];else d[r.col][r.id]=r.data;
    clearTimeout(GH.emT);GH.emT=setTimeout(()=>{GH.ops.forEach(o=>applyOp(GH.data,o));emitAll()},200)}).subscribe()}
const apiUrl=()=>`https://api.github.com/repos/${GH.cfg.owner}/${GH.cfg.repo}/contents/${GH.cfg.path}`;
const hdr=(raw)=>({Authorization:'Bearer '+GH.cfg.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json'});
function b64enc(str){const b=new TextEncoder().encode(str);let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s)}
async function sbRead(){const out={works:{},grids:{},meta:{}};
  for(let from=0;;from+=1000){const {data,error}=await SB.from('docs').select('col,id,data').range(from,from+999);
    if(error)throw new Error('Supabase: '+error.message);
    data.forEach(r=>{(out[r.col]=out[r.col]||{})[r.id]=r.data});if(data.length<1000)break}
  return out}
async function ghRead(){
  if(isSb()&&SB)return sbRead();
  if(!isSb()&&ghReady()){
    const r=await fetch(apiUrl()+'?ref='+encodeURIComponent(GH.cfg.branch)+'&t='+Date.now(),{headers:hdr(false),cache:'no-store'});
    if(!r.ok)throw new Error('GitHub '+r.status+(r.status===404?' (ไม่พบไฟล์ data.json หรือ repo/branch ไม่ถูกต้อง)':r.status===401?' (token ไม่ถูกต้อง)':''));
    const j=await r.json();GH.sha=j.sha;
    if(j.content){const bin=atob(j.content.replace(/\s/g,''));return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))))}
    const r2=await fetch(apiUrl()+'?ref='+encodeURIComponent(GH.cfg.branch),{headers:hdr(true),cache:'no-store'});return r2.json()}
  const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('อ่าน data.json ไม่ได้ ('+r.status+')');return r.json()}
function merge(a,b){const o={...a};for(const k in b){const v=b[k];o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))?merge(a[k],v):clone(v)}return o}
function applyOp(d,op){const [col,id]=op.path.split('/');d[col]=d[col]||{};
  if(op.t==='set')d[col][id]=clone(op.data);
  else if(op.t==='update'){if(d[col][id])d[col][id]=merge(d[col][id],op.data)}
  else if(op.t==='delete')delete d[col][id]}
function emit(l){const d=GH.data;
  if(l.id){const x=(d[l.c]||{})[l.id];l.cb({exists:!!x,data:()=>x})}
  else l.cb({docs:Object.entries(d[l.c]||{}).map(([id,x])=>({id,data:()=>x}))})}
const emitAll=()=>GH.ls.forEach(emit);
function stat(t){const e=$('#ghstat');if(e)e.textContent=t}
function schedule(){clearTimeout(GH.timer);stat('กำลังบันทึก…');GH.timer=setTimeout(ghFlush,isSb()?400:900)}
function queueOp(op){if(!ghReady())return Promise.reject({code:'not_granted'});applyOp(GH.data,op);GH.ops.push(op);emitAll();schedule();return Promise.resolve()}
async function sbFlush(batch){
  let i=0;
  while(i<batch.length){const o=batch[i];
    if(o.t==='set'){const rows=new Map();
      while(i<batch.length&&batch[i].t==='set'){const [c,id]=batch[i].path.split('/');rows.set(c+'/'+id,{col:c,id,data:batch[i].data});i++}
      const {error}=await SB.from('docs').upsert([...rows.values()]);if(error)throw error}
    else if(o.t==='update'){const [c,id]=o.path.split('/');
      const {error}=await SB.rpc('patch_doc',{p_col:c,p_id:id,p_patch:o.data});if(error)throw error;i++}
    else{const [c,id]=o.path.split('/');const {error}=await SB.from('docs').delete().eq('col',c).eq('id',id);if(error)throw error;i++}}}
async function ghFlush(){
  if(GH.busy||!GH.ops.length)return;GH.busy=true;const batch=GH.ops.splice(0);
  try{
    if(isSb()){await sbFlush(batch)}
    else{let ok=false;
      for(let i=0;i<3&&!ok;i++){
        const remote=await ghRead();batch.forEach(o=>applyOp(remote,o));
        const r=await fetch(apiUrl(),{method:'PUT',headers:{...hdr(false),'Content-Type':'application/json'},body:JSON.stringify({message:'update progress data',content:b64enc(JSON.stringify(remote)),sha:GH.sha,branch:GH.cfg.branch})});
        if(r.ok){const j=await r.json();GH.sha=j.content.sha;GH.data=remote;GH.ops.forEach(o=>applyOp(GH.data,o));emitAll();ok=true}
        else if(r.status!==409&&r.status!==422)throw new Error('GitHub '+r.status+(r.status===403||r.status===404?' (token ต้องมีสิทธิ์ Contents: Read and write)':''))}
      if(!ok)throw new Error('ข้อมูลถูกแก้พร้อมกัน ลองอีกครั้ง')}
    stat(GH.ops.length?'กำลังบันทึก…':'บันทึกแล้ว')
  }catch(e){GH.ops.unshift(...batch);stat('บันทึกไม่สำเร็จ');toast('บันทึกไม่สำเร็จ: '+(e&&e.message||e&&e.code||'error'))}
  GH.busy=false;if(GH.ops.length)schedule()}
const dbAdapter={
  collection:c=>({onSnapshot(cb){const l={c,cb};GH.ls.push(l);emit(l);return()=>{GH.ls=GH.ls.filter(x=>x!==l)}}}),
  doc:p=>{const [c,id]=p.split('/');return{onSnapshot(cb){const l={c,id,cb};GH.ls.push(l);emit(l);return()=>{GH.ls=GH.ls.filter(x=>x!==l)}},
    set:d=>queueOp({t:'set',path:p,data:d}),update:d=>queueOp({t:'update',path:p,data:d}),delete:()=>queueOp({t:'delete',path:p})}}};

(function(){const sp=document.getElementById('splash');if(!sp)return;let done=false;
  let nm='Modeva Progress',sb='ติดตามงานก่อสร้างรายตึก · ตึก D–G';try{const c=JSON.parse(localStorage.getItem('mp_brand')||'null');if(c&&c.n){nm=c.n;sb=c.sb||''}}catch(e){}
  const sn=document.getElementById('spn');if(sn){const px=Math.max(26,Math.min(48,Math.floor(520/Math.max(8,nm.length))));sn.style.fontSize=px+'px';sn.innerHTML=[...nm].map((ch,i)=>ch===' '?'<span class="sp"></span>':`<span style="animation-delay:${(.5+i*.05).toFixed(2)}s">${esc(ch)}</span>`).join('')}
  const tg=document.getElementById('sptg');if(tg)tg.textContent=sb;
  const hide=()=>{if(done)return;done=true;sp.classList.add('out');setTimeout(()=>sp.remove(),650)};
  const rm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  sp.addEventListener('click',hide);setTimeout(hide,rm?300:2600)})();

})();
</script>

</body></html>
